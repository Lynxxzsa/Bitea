<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BITEA — Menu Produk</title>

    <link
        rel="stylesheet"
        href="menu.css"
    >

</head>


<body>

    <!-- Intro animation -->
    <section
        id="intro"
        class="intro"
    >

        <!-- Logo BITEA -->
        <div class="intro-logo">

            <!--
                Ganti src dengan logo BITEA
                dari DKV jika sudah jadi.
            -->

            <img
                src="assets/logo-bitea.png"
                alt="BITEA"
            >

        </div>


        <!-- Produk yang muncul -->
        <div class="intro-products">

            <img
                src="assets/choco-bite.png"
                alt="Choco Bite"
                class="intro-product product-left"
            >

            <img
                src="assets/brown-tea.png"
                alt="Brown Tea"
                class="intro-product product-right"
            >

        </div>


        <!-- Text -->
        <div class="intro-text">

            <p>
                BITE × TEA
            </p>

            <h1>
                Good Food, Good Mood.
            </h1>

        </div>

    </section>


    <!-- =========================
         MENU PRODUK
    ========================== -->

    <main
        id="menuPage"
        class="menu-page"
    >

        <header class="menu-header">

            <h1>
                Menu Produk
            </h1>

            <p>
                Pilih menu yang ingin kamu pesan.
            </p>

        </header>


        <!-- Produk -->
        <section class="product-grid">

            <article class="product-card">

                <img
                    src="assets/choco-bite.png"
                    alt="Choco Bite"
                >

                <h2>
                    Choco Bite
                </h2>

                <p>
                    Makanan
                </p>

                <strong>
                    Rp15.000
                </strong>

                <button>
                    +
                </button>

            </article>


            <article class="product-card">

                <img
                    src="assets/brown-tea.png"
                    alt="Brown Tea"
                >

                <h2>
                    Brown Tea
                </h2>

                <p>
                    Minuman
                </p>

                <strong>
                    Rp10.000
                </strong>

                <button>
                    +
                </button>

            </article>

        </section>

    </main>


    <script src="intro.js"></script>

</body>

</html>
