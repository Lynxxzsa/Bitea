<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BITEA — Checkout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notification" class="notification">
  <div id="notificationIcon" class="notification-icon">✓</div>
  <div class="notification-content"><strong id="notificationTitle">Berhasil</strong><p id="notificationMessage">Pesan berhasil.</p></div>
  <button id="notificationClose" class="notification-close" type="button">×</button>
</div>

<main class="checkout-container">
  <div class="checkout-header">
    <p class="brand">BITEA</p>
    <h1>Checkout</h1>
    <p>Lengkapi data sebelum melakukan pembayaran.</p>
  </div>

  <section class="checkout-card">
    <div class="section-title"><span>01</span><div><h2>Data Pembeli</h2><p>Informasi pemesan</p></div></div>

    <div class="form-group"><label for="nama">Nama</label><input type="text" id="nama" placeholder="Masukkan nama kamu"></div>

    <div class="form-group"><label>Asal Pembeli</label>
      <div class="customer-type">
        <button type="button" class="type-btn" data-type="smk">SMK</button>
        <button type="button" class="type-btn" data-type="ma">MA</button>
        <button type="button" class="type-btn" data-type="other">OTHER</button>
      </div>
    </div>

    <div class="form-group hidden" id="classGroup">
      <label>Kelas</label>
      <div class="custom-dropdown" id="classDropdown">
        <button type="button" class="dropdown-button" id="classDropdownButton"><span id="selectedClass">Pilih kelas</span><span class="dropdown-arrow">˅</span></button>
        <div class="dropdown-menu" id="classDropdownMenu">
          <div class="dropdown-search"><input type="text" id="classSearch" placeholder="Cari kelas..." autocomplete="off"></div>
          <div class="class-options" id="classOptions"></div>
        </div>
      </div>
      <input type="hidden" id="kelas" value="">
    </div>

    <div class="form-group hidden" id="otherGroup">
      <label>Kamu dari</label>
      <div class="custom-dropdown" id="otherDropdown">
        <button type="button" class="dropdown-button" id="otherDropdownButton"><span id="selectedOther">Pilih pilihan</span><span class="dropdown-arrow">˅</span></button>
        <div class="dropdown-menu" id="otherDropdownMenu"><div class="class-options" id="otherOptions"></div></div>
      </div>
      <input type="hidden" id="other" value="">
    </div>

    <div class="form-group"><label for="telepon">No. Telepon <span>(Opsional)</span></label><input type="tel" id="telepon" placeholder="08xxxxxxxxxx"></div>
  </section>

  <section class="checkout-card">
    <div class="section-title"><span>02</span><div><h2>Pesanan</h2><p>Ringkasan pembelian dari keranjang</p></div></div>
    <div id="orderItems"></div>
    <div class="order-total"><span>Total</span><strong id="orderTotal">Rp0</strong></div>
  </section>

  <section class="checkout-card">
    <div class="section-title"><span>03</span><div><h2>Metode Pembayaran</h2><p>Pilih cara pembayaran</p></div></div>
    <div class="payment-options">
      <button type="button" class="payment-card" data-payment="cash"><div class="payment-icon">💵</div><div><strong>Cash</strong><p>Bayar langsung</p></div></button>
      <button type="button" class="payment-card" data-payment="qris"><div class="payment-icon qris-logo">QRIS</div><div><strong>QRIS</strong><p>Scan untuk membayar</p></div></button>
    </div>
    <p id="paymentStatus" class="payment-status">Belum memilih metode pembayaran.</p>
    <button id="continueButton" class="continue-button" type="button">Lanjutkan Pembayaran</button>
    <p class="secure-text">BITEA • SWAKARYA 2027</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
