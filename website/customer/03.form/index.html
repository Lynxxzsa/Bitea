<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BITEA — Checkout</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- Notification -->
    <div
        id="notification"
        class="notification"
    >

        <div
            id="notificationIcon"
            class="notification-icon"
        >
            ✓
        </div>

        <div class="notification-content">

            <strong id="notificationTitle">
                Berhasil
            </strong>

            <p id="notificationMessage">
                Pesan berhasil.
            </p>

        </div>

        <button
            id="notificationClose"
            class="notification-close"
            type="button"
        >
            ×
        </button>

    </div>


    <!-- Main checkout -->
    <main class="checkout-container">

        <!-- Checkout header -->
        <div class="checkout-header">

            <p class="brand">
                BITEA
            </p>

            <h1>
                Checkout
            </h1>

            <p>
                Lengkapi data sebelum melakukan pembayaran.
            </p>

        </div>


        <!-- Customer data -->
        <section class="checkout-card">

            <div class="section-title">

                <span>01</span>

                <div>

                    <h2>
                        Data Pembeli
                    </h2>

                    <p>
                        Informasi pemesan
                    </p>

                </div>

            </div>


            <!-- Customer name -->
            <div class="form-group">

                <label for="nama">
                    Nama
                </label>

                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama kamu"
                >

            </div>


            <!-- Customer origin -->
            <div class="form-group">

                <label>
                    Asal Pembeli
                </label>

                <div class="customer-type">

                    <button
                        type="button"
                        class="type-btn"
                        data-type="smk"
                    >
                        SMK
                    </button>

                    <button
                        type="button"
                        class="type-btn"
                        data-type="ma"
                    >
                        MA
                    </button>

                    <button
                        type="button"
                        class="type-btn"
                        data-type="other"
                    >
                        OTHER
                    </button>

                </div>

            </div>


            <!-- Class selection -->
            <div
                class="form-group hidden"
                id="classGroup"
            >

                <label>
                    Kelas
                </label>


                <!-- Custom class dropdown -->
                <div
                    class="custom-dropdown"
                    id="classDropdown"
                >

                    <!-- Dropdown button -->
                    <button
                        type="button"
                        class="dropdown-button"
                        id="classDropdownButton"
                    >

                        <span id="selectedClass">
                            Pilih kelas
                        </span>

                        <span class="dropdown-arrow">
                            ˅
                        </span>

                    </button>


                    <!-- Dropdown menu -->
                    <div
                        class="dropdown-menu"
                        id="classDropdownMenu"
                    >

                        <!-- Search class -->
                        <div class="dropdown-search">

                            <input
                                type="text"
                                id="classSearch"
                                placeholder="Cari kelas..."
                                autocomplete="off"
                            >

                        </div>


                        <!-- Class options -->
                        <div
                            class="class-options"
                            id="classOptions"
                        >

                            <!-- Options are generated by JavaScript -->

                        </div>

                    </div>

                </div>


                <!-- Hidden value for JavaScript -->
                <input
                    type="hidden"
                    id="kelas"
                    value=""
                >

            </div>


            <!-- Other customer origin -->
            <div
                class="form-group hidden"
                id="otherGroup"
            >

                <label>
                    Kamu dari
                </label>

                <!-- Custom other dropdown -->
                <div
                    class="custom-dropdown"
                    id="otherDropdown"
                >

                    <!-- Dropdown button -->
                    <button
                        type="button"
                        class="dropdown-button"
                        id="otherDropdownButton"
                    >

                        <span id="selectedOther">
                            Pilih pilihan
                        </span>

                        <span class="dropdown-arrow">
                            ˅
                        </span>

                    </button>


                    <!-- Dropdown menu -->
                    <div
                        class="dropdown-menu"
                        id="otherDropdownMenu"
                    >

                        <!-- Other options -->
                        <div
                            class="class-options"
                            id="otherOptions"
                        >

                            <!-- Options are generated by JavaScript -->

                        </div>

                    </div>

                </div>

                <!-- Hidden value for JavaScript -->
                <input
                    type="hidden"
                    id="other"
                    value=""
                >

            </div>


            <!-- Phone number -->
            <div class="form-group">

                <label for="telepon">

                    No. Telepon

                    <span>
                        (Opsional)
                    </span>

                </label>

                <input
                    type="tel"
                    id="telepon"
                    placeholder="08xxxxxxxxxx"
                >

            </div>

        </section>


        <!-- Order summary -->
        <section class="checkout-card">

            <div class="section-title">

                <span>02</span>

                <div>

                    <h2>
                        Pesanan
                    </h2>

                    <p>
                        Ringkasan pembelian
                    </p>

                </div>

            </div>


            <!-- Order item -->
            <div class="order-item">

                <div>

                    <strong>
                        Choco Bite
                    </strong>

                    <small>
                        × 2
                    </small>

                </div>

                <strong>
                    Rp20.000
                </strong>

            </div>


            <!-- Order item -->
            <div class="order-item">

                <div>

                    <strong>
                        Brown Tea
                    </strong>

                    <small>
                        × 1
                    </small>

                </div>

                <strong>
                    Rp8.000
                </strong>

            </div>


            <!-- Order total -->
            <div class="order-total">

                <span>
                    Total
                </span>

                <strong>
                    Rp28.000
                </strong>

            </div>

        </section>


       <!-- Metode pembayaran -->
<div class="payment-options">

    <!-- Pembayaran cash -->
    <button
        type="button"
        class="payment-card"
        data-payment="cash"
    >

        <div class="payment-icon">
            💵
        </div>

        <div>

            <strong>
                Cash
            </strong>

            <p>
                Bayar langsung
            </p>

        </div>

    </button>


    <!-- Pembayaran QRIS -->
    <button
        type="button"
        class="payment-card"
        data-payment="qris"
    >

        <div class="payment-icon qris-logo">

            <img
                src="Assets/QRIS.svg"
                alt="QRIS"
            >

        </div>

        <div>

            <strong>
                QRIS
            </strong>

            <p>
                Scan untuk membayar
            </p>

        </div>

    </button>

</div>


<!-- Status metode pembayaran -->
<p
    id="paymentStatus"
    class="payment-status"
>
    Belum memilih metode pembayaran.
</p>


<!-- Tombol lanjut pembayaran -->
<button
    id="continueButton"
    class="continue-button"
    type="button"
>
    Lanjutkan Pembayaran
</button>

            <p class="secure-text">
                BITEA • SWAKARYA 2027
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
