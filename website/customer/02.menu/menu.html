<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BITEA — Menu Produk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <section id="intro" class="intro">
    <div class="intro-logo">
      <img src="assets/logo-bitea.svg" alt="BITEA">
    </div>
    <div class="intro-products">
      <img src="assets/choco-bite.svg" alt="Choco Bite" class="intro-product product-left">
      <img src="assets/brown-tea.svg" alt="Brown Tea" class="intro-product product-right">
    </div>
    <div class="intro-text">
      <p>BITE × TEA</p>
      <h1>Good Food, Good Mood.</h1>
    </div>
  </section>

  <main id="menuPage" class="menu-page">
    <header class="menu-header">
      <div>
        <p class="brand-mini">BITEA</p>
        <h1>Menu Produk</h1>
        <p>Pilih menu yang ingin kamu pesan.</p>
      </div>
      <button id="cartButton" class="cart-button" type="button">
        🛒 Keranjang <span id="cartCount">0</span>
      </button>
    </header>

    <section class="product-grid">
      <article class="product-card">
        <img src="assets/choco-bite.svg" alt="Choco Bite">
        <h2>Choco Bite</h2>
        <p>Makanan</p>
        <strong>Rp15.000</strong>
        <button class="add-button" type="button" data-name="Choco Bite" data-price="15000">+</button>
      </article>

      <article class="product-card">
        <img src="assets/brown-tea.svg" alt="Brown Tea">
        <h2>Brown Tea</h2>
        <p>Minuman</p>
        <strong>Rp10.000</strong>
        <button class="add-button" type="button" data-name="Brown Tea" data-price="10000">+</button>
      </article>
    </section>
  </main>

  <aside id="cartPanel" class="cart-panel" aria-hidden="true">
    <div class="cart-panel-header">
      <div>
        <small>Pesanan Kamu</small>
        <h2>Keranjang</h2>
      </div>
      <button id="cartClose" class="icon-button" type="button" aria-label="Tutup">×</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total"><span>Total</span><strong id="cartTotal">Rp0</strong></div>
      <button id="checkoutButton" class="checkout-button" type="button">Lanjut ke Checkout</button>
      <a href="../01.Homepage/index.html" class="back-link">← Kembali ke beranda</a>
    </div>
  </aside>
  <div id="cartBackdrop" class="cart-backdrop"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="intro.js"></script>
</body>
</html>
